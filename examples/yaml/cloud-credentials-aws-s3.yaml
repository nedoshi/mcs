# Velero AWS credentials secret template
# DO NOT commit real credentials. Create at deploy time:
#
#   cat <<EOF > credentials-velero
#   [default]
#   aws_access_key_id=AKIA...
#   aws_secret_access_key=...
#   EOF
#   oc create secret generic cloud-credentials-aws \
#     --namespace openshift-adp \
#     --from-file cloud=credentials-velero
#   rm credentials-velero
#
# For ROSA HCP production, prefer IRSA instead of static keys.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials-aws
  namespace: openshift-adp
  labels:
    dr.mcs.redhat.com/strategy: cross-cloud-s3
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=REPLACE_ME
    aws_secret_access_key=REPLACE_ME
