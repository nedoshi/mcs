apiVersion: v1
kind: Namespace
metadata:
  name: image-pruner
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-pruner
  namespace: image-pruner
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-pruner
  namespace: image-pruner
  labels:
    app: image-pruner
spec:
  selector:
    matchLabels:
      app: image-pruner
  template:
    metadata:
      labels:
        app: image-pruner
    spec:
      serviceAccountName: image-pruner
      hostPID: true
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      tolerations:
        - operator: Exists
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
      containers:
        - name: pruner
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: host
              mountPath: /host
          env:
            - name: HIGH_THRESHOLD
              value: "70"
            - name: CHECK_INTERVAL
              value: "300"
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                USAGE=$(chroot /host df /var/lib/containers | awk 'NR==2 {gsub(/%/,""); print $5}')
                if [ "${USAGE}" -gt "${HIGH_THRESHOLD}" ]; then
                  echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) usage ${USAGE}% > ${HIGH_THRESHOLD}%, pruning"
                  chroot /host crictl rmi --prune 2>&1
                fi
                sleep "${CHECK_INTERVAL}"
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
