name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - "docs/guide/aro-decision-matrix/README.md"
      - ".github/workflows/convert-markdown.yml"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Convert Markdown to PDF
        run: |
          mkdir -p pdf-output
          pandoc "docs/guide/aro-decision-matrix/README.md" \
            --from gfm \
            --to html5 \
            --pdf-engine=wkhtmltopdf \
            --toc \
            --output "pdf-output/aro-decision-matrix.pdf"

      - name: Verify output exists
        run: ls -lah pdf-output

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-pdf
          path: pdf-output/
