apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrator
  namespace: db-migration
  labels:
    app.kubernetes.io/name: db-migrator
    app.kubernetes.io/component: migration
  annotations:
    # Optional IRSA for tooling that talks to AWS APIs directly.
    # ESO controller usually holds Secrets Manager access instead.
    description: Dedicated SA for Expand/Backfill/Contract Jobs — not used by app pods
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-api
  namespace: db-migration
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/component: application
