# External Secrets Operator — AWS Secrets Manager (ROSA).
# Requires ESO installed + IRSA on the ESO controller (or ClusterSecretStore auth).
# Edit role ARN / region before apply.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: db-migration
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: db-migrator
