# Lab fallback — replace with ESO ExternalSecrets in real clusters.
# Secret *names* stay the same so Jobs/Deployments do not change.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-ddl
  namespace: db-migration
  labels:
    app.kubernetes.io/component: migration-credentials
type: Opaque
stringData:
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: orders
  PGUSER: db_ddl
  PGPASSWORD: ddl-lab-pass-change-me
  PGOPTIONS: "-c search_path=app,public"
---
