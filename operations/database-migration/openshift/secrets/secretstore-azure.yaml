# External Secrets Operator — Azure Key Vault (ARO).
# Edit vault URL + auth before apply.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: db-migration
spec:
  provider:
    azurekv:
      vaultUrl: https://REPLACE-WITH-VAULT.vault.azure.net
      authType: WorkloadIdentity
      serviceAccountRef:
        name: db-migrator
