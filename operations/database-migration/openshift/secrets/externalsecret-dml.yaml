apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials-dml
  namespace: db-migration
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: db-credentials-dml
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: db-migration/dml
        property: username
    - secretKey: PGPASSWORD
      remoteRef:
        key: db-migration/dml
        property: password
    - secretKey: PGHOST
      remoteRef:
        key: db-migration/dml
        property: host
    - secretKey: PGPORT
      remoteRef:
        key: db-migration/dml
        property: port
    - secretKey: PGDATABASE
      remoteRef:
        key: db-migration/dml
        property: dbname
