---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-baseline-helm
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: all-production
        requeueAfterSeconds: 180
  template:
    metadata:
      name: '{{ .clusterName }}-baseline'
      labels:
        app.kubernetes.io/part-of: platform-baseline
    spec:
      project: platform
      source:
        repoURL: https://github.com/your-org/tf-rosa-shared-vpc.git
        targetRevision: main
        path: gitops/charts/cluster-baseline
        helm:
          valueFiles:
            - ../../cluster-values/baseline/{{ .clusterName }}.yaml
      destination:
        server: '{{ .clusterServer }}'
        name: '{{ .clusterName }}'
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
