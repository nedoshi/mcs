# Template: copy this file to <cluster-name>.yaml and fill in values.
# The filename MUST match the ManagedCluster name in ACM.

clusterName: ""

storage:
  enabled: true
  kmsKeyArn: "arn:aws:kms:<region>:<account-id>:key/<key-id>"
  className: gp3-csi-kms
  isDefault: true

# OAuth / Identity Provider
# If Terraform rosa-entra-idp module manages OAuth for this cluster, set enabled: false.
# If GitOps is the sole owner of OAuth (e.g. ARO clusters or standalone), set enabled: true.
identityProvider:
  enabled: false
  # Uncomment below when enabled: true
  # clientID: "<azure-ad-app-registration-client-id>"
  # issuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  # secretName: rosa-oidc-client-secret
