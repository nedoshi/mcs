---
# PostgreSQL Secret
# ⚠️ WARNING: Change these default passwords in production!
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: keycloak
type: Opaque
stringData:
  username: postgres
  password: postgres-password-change-me
  database: postgres

---
# Keycloak Database Connection Secret
# ⚠️ WARNING: Change these default passwords in production!
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
type: Opaque
stringData:
  username: keycloak
  password: keycloak-password-change-me
  database: keycloak

# NOTE: The TLS secret (my-tls-secret) is created automatically by deploy.sh
# If deploying manually, create it with:
#   oc create secret tls my-tls-secret --cert=tls.crt --key=tls.key -n keycloak
# Or generate a self-signed certificate:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=keycloak/O=keycloak"
#   oc create secret tls my-tls-secret --cert=tls.crt --key=tls.key -n keycloak
