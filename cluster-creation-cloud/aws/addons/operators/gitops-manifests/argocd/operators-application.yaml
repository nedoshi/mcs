# Argo CD Application for Pipelines, GitOps, and Logging operators
# Apply after GitOps is installed and Argo CD is ready
#
# Usage:
#   export ARGOCD_REPO_URL=https://github.com/your-org/your-repo
#   export ARGOCD_REVISION=main
#   envsubst < operators-application.yaml | oc apply -f -
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operators-pipelines-gitops-logging
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${ARGOCD_REPO_URL}
    targetRevision: ${ARGOCD_REVISION}
    path: cluster-creation/aws/addons/operators/gitops-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
