apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - mappingMethod: claim
    name: rh-aro
    openID:
      claims:
        email:
        - email
        name:
        - name
        preferredUsername:
        - preferred_username
      clientID: 6eaadfa5-cbcb-455f-a68d-27cd9ae59d5d
      clientSecret:
        name: openid-client-secret
      extraScopes: 
      - profile
      - openid
      - email
      issuer: https://login.microsoftonline.com/64dc69e4-d083-49fc-9569-ebece1dd1408/v2.0
    type: OpenID
