apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: production
  labels:
    app: sample-app
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: sample-app-tls
spec:
  type: ClusterIP
  selector:
    app: sample-app
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  sessionAffinity: None
