apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-config
  namespace: production
data:
  database-host: "my-postgres-server.postgres.database.azure.com"
  database-name: "appdb"
  database-port: "5432"
  redis-host: "my-redis.redis.cache.windows.net"
  redis-port: "6380"
  api-timeout: "30"
  log-level: "info"
  app-env: "production"
