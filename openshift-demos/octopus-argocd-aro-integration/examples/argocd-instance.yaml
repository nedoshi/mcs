# OPTIONAL alternative to the default openshift-gitops instance — not an extra step.
# If you apply this, put Application CRs in namespace hello-aro and skip the
# default-instance flow in README §2.4 (Application metadata.namespace: openshift-gitops).
# Requires Red Hat OpenShift GitOps operator installed cluster-wide.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: hello-aro-gitops
  namespace: hello-aro
spec:
  server:
    route:
      enabled: true
      wildcardPolicy: None
  resourceTrackingMethod: annotation
