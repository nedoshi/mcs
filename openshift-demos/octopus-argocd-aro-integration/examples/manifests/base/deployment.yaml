apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-aro
  labels:
    app: hello-aro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-aro
  template:
    metadata:
      labels:
        app: hello-aro
    spec:
      containers:
        - name: hello-aro
          # Octopus "Update Argo CD Application Image Tags" step updates this tag on deploy.
          image: registry.example.com/hello-aro:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
