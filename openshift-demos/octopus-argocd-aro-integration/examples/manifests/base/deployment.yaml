apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-aro
  labels:
    app: hello-aro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-aro
  template:
    metadata:
      labels:
        app: hello-aro
    spec:
      containers:
        - name: hello-aro
          # OpenShift-compatible image (listens on 8080 under default SCC).
          # Octopus "Update Argo CD Application Image Tags" step updates this tag on deploy.
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
