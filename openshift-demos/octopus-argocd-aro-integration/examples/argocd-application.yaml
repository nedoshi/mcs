# Argo CD Application for hello-aro on ARO.
# Apply this CR to openshift-gitops (default cluster-scoped instance).
# Do not also apply examples/argocd-instance.yaml unless you are using a team-scoped
# instance instead of the default — they are alternatives, not layers.
#
# Octopus annotation VALUES are slugs, not display names.
# Use Octopus UI: Infrastructure → Argo CD Instances → Generate Scoping Annotations.
# Duplicate annotations for Production with that environment's slug.
#
# Edit repoURL + path before apply. If Argo CD watches this repository:
#   repoURL: https://github.com/<org>/mcs.git
#   path: openshift-demos/octopus-argocd-aro-integration/examples/manifests/base
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-aro
  namespace: openshift-gitops
  annotations:
    argo.octopus.com/project.hello-aro-source: hello-aro
    argo.octopus.com/environment.hello-aro-source: Staging
spec:
  project: default
  source:
    name: hello-aro-source
    repoURL: https://github.com/your-org/hello-aro-gitops.git
    targetRevision: main
    path: manifests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-aro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
