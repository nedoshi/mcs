---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosa-101-loadgen
  labels:
    app: rosa-101-loadgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rosa-101-loadgen
  template:
    metadata:
      labels:
        app: rosa-101-loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.5.0
          env:
            - name: TARGET_URL
              value: "http://rosa-101-welcome:8080/api/load?ms=300"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Generating load against ${TARGET_URL}"
              while true; do
                for _ in $(seq 1 40); do
                  curl -s "${TARGET_URL}" >/dev/null &
                done
                wait
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
