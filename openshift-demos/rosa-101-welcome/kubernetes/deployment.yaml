---
apiVersion: v1
kind: Namespace
metadata:
  name: rosa-101-demo
  labels:
    app: rosa-101-welcome
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosa-101-welcome
  namespace: rosa-101-demo
  labels:
    app: rosa-101-welcome
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rosa-101-welcome
  template:
    metadata:
      labels:
        app: rosa-101-welcome
    spec:
      containers:
        - name: rosa-101-welcome
          # Use only after a successful build. Import-from-git creates this automatically.
          image: image-registry.openshift-image-registry.svc:5000/rosa-101-demo/rosa-101-welcome:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WELCOME_MESSAGE
              value: "Welcome to ROSA!"
            - name: APP_VERSION
              value: "1.0.0"
            - name: OPENSHIFT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rosa-101-welcome
  namespace: rosa-101-demo
  labels:
    app: rosa-101-welcome
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: rosa-101-welcome
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rosa-101-welcome
  namespace: rosa-101-demo
  labels:
    app: rosa-101-welcome
spec:
  to:
    kind: Service
    name: rosa-101-welcome
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
