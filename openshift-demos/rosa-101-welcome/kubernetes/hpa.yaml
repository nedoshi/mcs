---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rosa-101-welcome
  labels:
    app: rosa-101-welcome
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rosa-101-welcome
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
