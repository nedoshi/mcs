# ImageStreams and Docker BuildConfigs — build context is the demo root directory.
# deploy.sh runs: oc start-build <name> --from-dir=. --wait
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: catalog-service
  namespace: retail-hub
  labels:
    app: catalog-service
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: catalog-service
  namespace: retail-hub
  labels:
    app: catalog-service
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: services/catalog-service/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: catalog-service:latest
  triggers: []
