# Rebuild and roll out DB-backed services after code changes:
#   for s in catalog-service cart-service order-service; do
#     oc start-build "$s" --from-dir=. --wait -n retail-hub
#     oc rollout restart "deployment/$s" -n retail-hub
#   done
# OpenShift Topology view shows service-to-service wiring via the API Gateway.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: retail-hub
  labels:
    app: catalog-service
    app.kubernetes.io/component: catalog
    app.kubernetes.io/part-of: enterprise-retail-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
        app.kubernetes.io/component: catalog
    spec:
      containers:
        - name: catalog-service
          image: image-registry.openshift-image-registry.svc:5000/retail-hub/catalog-service:latest
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - secretRef:
                name: db-connection
            - configMapRef:
                name: microservice-env
          env:
            - name: PORT
              value: "8081"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: retail-hub
  labels:
    app: catalog-service
spec:
  ports:
    - name: http
      port: 8081
      targetPort: http
  selector:
    app: catalog-service
