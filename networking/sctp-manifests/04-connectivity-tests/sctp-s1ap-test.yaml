apiVersion: v1
kind: Pod
metadata:
  name: s1ap-mme-sim
  namespace: sctp-test
  labels:
    app: mme-sim
spec:
  containers:
    - name: mme
      image: registry.access.redhat.com/ubi9/ubi:latest
      command:
        - /bin/sh
        - -c
        - |
          set -e
          python3 - <<'PY'
          import socket, threading

          def handle(conn, addr):
              print(f"S1AP assoc from {addr}", flush=True)
              try:
                  while True:
                      data = conn.recv(4096)
                      if not data:
                          break
                      conn.sendall(data)
              finally:
                  conn.close()

          srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM, 132)
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("0.0.0.0", 36412))
          srv.listen(5)
          print("Simulated MME SCTP echo on 36412", flush=True)
          while True:
              conn, addr = srv.accept()
              threading.Thread(target=handle, args=(conn, addr), daemon=True).start()
          PY
      ports:
        - containerPort: 36412
          protocol: SCTP
          name: s1ap
---
apiVersion: v1
kind: Service
metadata:
  name: mme-sim
  namespace: sctp-test
spec:
  selector:
    app: mme-sim
  ports:
    - name: s1ap
      protocol: SCTP
      port: 36412
      targetPort: 36412
  type: ClusterIP
