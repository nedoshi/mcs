apiVersion: v1
kind: Pod
metadata:
  name: sctp-server
  namespace: sctp-test
  labels:
    app: sctp-server
spec:
  containers:
    - name: sctp-server
      image: registry.access.redhat.com/ubi9/ubi:latest
      command:
        - /bin/sh
        - -c
        - |
          set -e
          # Prefer a durable Python SCTP echo server — ncat --exec often exits on SCTP close
          python3 - <<'PY'
          import socket, threading

          def handle(conn, addr):
              print(f"assoc from {addr}", flush=True)
              try:
                  while True:
                      data = conn.recv(4096)
                      if not data:
                          break
                      conn.sendall(data)
              finally:
                  conn.close()

          # IPPROTO_SCTP = 132, one-to-one style
          srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM, 132)
          srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("0.0.0.0", 38412))
          srv.listen(5)
          print("SCTP echo listening on 38412", flush=True)
          while True:
              conn, addr = srv.accept()
              threading.Thread(target=handle, args=(conn, addr), daemon=True).start()
          PY
      ports:
        - containerPort: 38412
          protocol: SCTP
          name: sctp
