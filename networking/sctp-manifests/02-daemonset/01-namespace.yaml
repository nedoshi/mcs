apiVersion: v1
kind: Namespace
metadata:
  name: sctp-module-loader
  labels:
    app.kubernetes.io/name: sctp-module-loader
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: sctp-test
  labels:
    app.kubernetes.io/name: sctp-test
    # Connectivity test pods need package installs / ncat; use baseline permissive PSA
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
