# checkout-service — order / checkout backend (NodePort required by ALBO)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: shop-demo
  labels:
    app: checkout-service
    app.kubernetes.io/part-of: alb-ingress-grouping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout
          image: image-registry.openshift-image-registry.svc:5000/shop-demo/checkout-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: shop-demo
  labels:
    app: checkout-service
spec:
  type: NodePort
  selector:
    app: checkout-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: checkout-service
  namespace: shop-demo
  labels:
    app: checkout-service
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: checkout-service:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: checkout-service
  namespace: shop-demo
  labels:
    app: checkout-service
