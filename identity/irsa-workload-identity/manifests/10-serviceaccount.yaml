# ServiceAccount for IRSA.
# setup-iam.sh annotates: eks.amazonaws.com/role-arn=<role-arn>
# The ROSA pod-identity-webhook mutates pods that use this SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader
  namespace: irsa-demo
  labels:
    app.kubernetes.io/part-of: irsa-workload-identity
  # Annotation applied by scripts/setup-iam.sh (do not hardcode account/role here):
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/irsa-demo-s3-reader
